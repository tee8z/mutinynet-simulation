[package]
name = "mutinynet-bridge-ui"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
maud = "0.27"
mime_guess = "2.0"
rust-embed = "8.5"
tokio = { version = "1.44", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.12", features = ["serde", "v4"] }

[build-dependencies]
hex = "0.4"
minify-js = "0.6"
sha2 = "0.10"
walkdir = "2.5"
