[package]
name = "ark-lnd-swap-provider"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1.0"
ark-client = { version = "0.9.2", default-features = false, features = ["tls-webpki-roots"] }
ark-core = "0.9.2"
ark-grpc = { version = "0.9.2", default-features = false, features = ["tls-webpki-roots"] }
axum = "0.8"
bitcoin = { version = "0.32.7", features = ["rand", "serde"] }
hex = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "=0.9.0", default-features = false, features = ["derive", "macros", "migrate", "runtime-tokio", "sqlite"] }
tokio = { version = "1.44", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.12", features = ["serde", "v4"] }
voltage-tonic-lnd = { git = "https://github.com/voltagecloud/tonic_lnd", rev = "a8f5d481025a85b4a574cccc949070f6df5a1da6", default-features = false, features = ["lightningrpc", "invoicesrpc", "routerrpc", "ring", "tls"] }
